name: abc release assets QA
on:
  push:
    paths: ['res/**', 'scripts/verify-release.py', 'crossplatform/android/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.6', cache: true}
      - name: Build optimized release APK
        working-directory: crossplatform
        run: flutter build apk --release
      - name: Verify release chime and absence of debug classes
        run: python3 scripts/verify-release.py crossplatform/build/app/outputs/flutter-apk/app-release.apk

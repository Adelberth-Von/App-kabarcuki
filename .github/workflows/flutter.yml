name: abc cross-platform QA
on:
  push:
    paths: ['crossplatform/**', 'src/**', 'res/**', 'apple/**', 'scripts/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
    inputs:
      apple_only:
        description: 'Run only iPhone QA'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: ${{ github.event.inputs.apple_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.6', cache: true}
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: crossplatform
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd crossplatform && flutter drive --keep-app-running --dart-define=QA_CLEANUP=true --driver=test_driver/integration.dart --target=integration_test/native_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-android-${{ matrix.api }}
          path: crossplatform/qa-screenshots
  apple:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.6', cache: true}
      - run: brew install xcodegen
      - name: Prepare shared Flutter iOS host
        run: |
          cd crossplatform
          flutter pub get
          flutter build ios --simulator --debug --config-only --no-codesign
          cd ios
          xcodegen generate
      - name: Build and test on iPhone simulator
        timeout-minutes: 15
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          cd crossplatform
          mkdir -p ../work
          flutter build ios --simulator --debug --dart-define=QA_CLEANUP=true --target=integration_test/native_test.dart 2>&1 | tee ../work/flutter-ios-drive.log
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          # The simulator runs on the CI host. A fixed loopback port avoids
          # relying on OS log forwarding to discover the test VM service.
          xcrun simctl launch --terminate-running-process --console "$DEVICE" id.kabar.app --enable-dart-profiling --enable-checked-mode --verify-entry-points --vm-service-port=8181 --disable-service-auth-codes > ../work/iphone-console.log 2>&1 &
          VM_URL='http://127.0.0.1:8181/'
          VM_READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 1 "${VM_URL}getVM" > ../work/iphone-vm.json; then VM_READY=true; break; fi
            sleep 1
          done
          if [ "$VM_READY" != true ]; then
            cat ../work/iphone-console.log
            PID=$(pgrep -f '/Runner.app/Runner' | head -1 || true)
            if [ -n "$PID" ]; then sample "$PID" 3 1 -file ../work/iphone-sample.txt || true; fi
            exit 1
          fi
          flutter drive --keep-app-running --dart-define=QA_CLEANUP=true --driver=test_driver/integration.dart --target=integration_test/native_test.dart --use-existing-app="$VM_URL" -d "$DEVICE" 2>&1 | tee -a ../work/flutter-ios-drive.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Capture simulator diagnostics
        if: always()
        run: |
          mkdir -p work
          xcrun simctl io booted screenshot work/iphone-final.png || true
          xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS "id.kabar.app"' > work/iphone-system.log || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Runner*' -exec cp {} work/ \; || true
        shell: bash --noprofile --norc -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-iPhone-simulator
          path: |
            crossplatform/build/ios/iphonesimulator/Runner.app
            crossplatform/qa-screenshots
            work/flutter-ios-drive.log
            work/iphone-final.png
            work/iphone-system.log
            work/iphone-console.log
            work/iphone-sample.txt
            work/iphone-vm.json
            work/Runner*

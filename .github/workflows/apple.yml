name: Apple build and interoperability
on:
  push:
    paths: ['apple/**', 'src/id/kabar/app/Pairing.java', 'src/id/kabar/app/KabarState.java', 'src/id/kabar/app/StatusLogic.java', 'tests/Interop.java', 'scripts/test-apple.sh', '.github/workflows/apple.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: bash scripts/test-apple.sh
      - run: brew install xcodegen
      - run: cd apple && xcodegen generate
      - run: xcodebuild -project apple/Kabar.xcodeproj -scheme Kabar -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath work/AppleBuild CODE_SIGNING_ALLOWED=NO build | tee work/apple-build.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: UI test on iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project apple/Kabar.xcodeproj -scheme Kabar -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath work/AppleBuild -resultBundlePath work/AppleUI.xcresult CODE_SIGNING_ALLOWED=NO test | tee work/apple-ui.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Export UI screenshots
        if: always()
        run: if [ -d work/AppleUI.xcresult ]; then xcrun xcresulttool export attachments --path work/AppleUI.xcresult --output-path work/AppleScreenshots; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Kabar-Apple-simulator
          path: work/AppleBuild/Build/Products/Debug-iphonesimulator/Kabar.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-build-log
          path: |
            work/apple-build.log
            work/apple-ui.log
            work/AppleUI.xcresult
            work/AppleScreenshots
          if-no-files-found: ignore

name: Android compatibility
on:
  push:
    paths: ['src/**', 'res/**', 'tests/**', 'android/**', '*.gradle.kts', 'gradle.properties', 'AndroidManifest.xml', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: bash scripts/test-domain.sh
      - run: gradle :android:assembleDebug :android:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with: { name: android-test-apks, path: 'android/build/outputs/apk/**/*.apk' }
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android-test-apks, path: apk }
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          target: google_apis
          heap-size: 256M
          disable-animations: true
          script: |
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install -r apk/debug/android-debug.apk
            adb install -r apk/androidTest/debug/android-debug-androidTest.apk
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant id.kabar.app android.permission.POST_NOTIFICATIONS; fi
            adb shell am instrument -w -e mode ui id.kabar.qa/id.kabar.app.DeviceQA | tee result.txt
            adb logcat -d -s AndroidRuntime | tee crash-log.txt
            adb shell screencap -p /sdcard/kabar.png
            adb pull /sdcard/kabar.png screenshot.png
            adb exec-out run-as id.kabar.app cat cache/ui-home.png > ui-home.png || true
            adb exec-out run-as id.kabar.app cat cache/ui-confirm.png > ui-confirm.png || true
            for theme in relationship-dark relationship-light default-dark appearance-dark; do adb exec-out run-as id.kabar.app cat cache/ui-$theme.png > ui-$theme.png || true; done
            grep -q 'PASS Device UI' result.txt
            if grep -q 'FAIL' result.txt; then exit 1; fi
            if [ ${{ matrix.api }} -eq 35 ]; then adb shell settings put system font_scale 1.5; adb shell am instrument -w -e mode ui id.kabar.qa/id.kabar.app.DeviceQA | tee large-font.txt; grep -q 'PASS Device UI' large-font.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'android-api-${{ matrix.api }}'
          path: |
            result.txt
            crash-log.txt
            screenshot.png
            large-font.txt
            ui-home.png
            ui-confirm.png
            ui-relationship-dark.png
            ui-relationship-light.png
            ui-default-dark.png
            ui-appearance-dark.png
          if-no-files-found: ignore

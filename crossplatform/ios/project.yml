name: Runner
options:
  deploymentTarget:
    iOS: '16.0'
configs:
  Debug: debug
  Release: release
  Profile: release
packages:
  KabarCore:
    path: ../../apple
  FlutterGeneratedPluginSwiftPackage:
    path: Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.5.0'
    CURRENT_PROJECT_VERSION: '5'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes: [Info.plist]
      - ../../apple/App/KabarModel.swift
      - ../../apple/App/LocationSampler.swift
      - ../../apple/Shared/SharedStore.swift
      - ../../apple/Shared/PhoneText.swift
    configFiles:
      Debug: Flutter/Debug.xcconfig
      Release: Flutter/Release.xcconfig
      Profile: Flutter/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.kabar.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        INFOPLIST_FILE: Runner/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/Frameworks']
    dependencies:
      - package: KabarCore
      - package: FlutterGeneratedPluginSwiftPackage
      - target: KabarWidget
        embed: true
      - target: KabarNotification
        embed: true
    preBuildScripts:
      - name: Flutter Build
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Thin Binary
        script: /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.id.kabar.shared]
        keychain-access-groups: ['$(AppIdentifierPrefix)id.kabar.shared']
        aps-environment: development
  KabarWidget:
    type: app-extension
    platform: iOS
    sources: [../../apple/Widget, ../../apple/Shared]
    dependencies:
      - package: KabarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.kabar.app.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: abc
        KabarKeychainGroup: $(AppIdentifierPrefix)id.kabar.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.id.kabar.shared]
        keychain-access-groups: ['$(AppIdentifierPrefix)id.kabar.shared']
  KabarNotification:
    type: app-extension
    platform: iOS
    sources: [../../apple/Notification, ../../apple/Shared/SharedStore.swift, ../../apple/Shared/PhoneText.swift]
    dependencies:
      - package: KabarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.kabar.app.notification
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Notification-Info.plist
      properties:
        CFBundleDisplayName: abc Notifications
        KabarKeychainGroup: $(AppIdentifierPrefix)id.kabar.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Config/Notification.entitlements
      properties:
        com.apple.security.application-groups: [group.id.kabar.shared]
        keychain-access-groups: ['$(AppIdentifierPrefix)id.kabar.shared']
schemes:
  Runner:
    build:
      targets:
        Runner: all
    run:
      config: Debug

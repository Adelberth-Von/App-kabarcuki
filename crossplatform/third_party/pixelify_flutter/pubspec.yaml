name: pixelify_flutter
description: "A Flutter extension for retro Pixelated looking ui widgets and animations and effects."
version: 0.0.1
homepage: https://jyothish-ram.me/projects/pixelify_flutter
repository: https://github.com/jyothish-ram/pixelify_flutter


environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  # To add assets to your package, add an assets section, like this:
